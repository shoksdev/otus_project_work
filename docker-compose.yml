services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  selenoid:
    image: "aerokube/selenoid:latest-release"
    container_name: selenoid
    restart: unless-stopped
    ports:
      - "4444:4444"
    volumes:
      - "./browsers.json:/etc/selenoid/browsers.json:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./selenoid/video:/opt/selenoid/video"
      - "./selenoid/logs:/opt/selenoid/logs"
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=${PWD}/selenoid/video
      - DOCKER_API_VERSION=1.54

    command:
      - "-conf"
      - "/etc/selenoid/browsers.json"
      - "-container-network"
      - "ci-net"
      - "-video-output-dir"
      - "/opt/selenoid/video"
      - "-log-output-dir"
      - "/opt/selenoid/logs"
      - "-limit"
      - "5"
      - "-timeout"
      - "5m"
    networks:
      - ci-net
    depends_on:
      - jenkins

  selenoid-ui:
    image: "aerokube/selenoid-ui:latest-release"
    container_name: selenoid-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    networks:
      - ci-net
    depends_on:
      - selenoid

volumes:
  jenkins-home:

networks:
  ci-net:
    name: ci-net
    driver: bridge
